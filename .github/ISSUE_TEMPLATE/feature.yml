name: Feature
description: Describe a feature to build. Assign it to Copilot to have a pull request opened.
title: "[Feature]: "
labels: [factory, feature]
body:
  - type: textarea
    id: summary
    attributes:
      label: What should users be able to do?
      placeholder: "Users can save a search and see it on their dashboard."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe observable behavior in the UI or API.
      placeholder: "Given ..., when ..., then ..."
    validations:
      required: true
